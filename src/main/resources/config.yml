# ImpossibleDragon configuration  (REBALANCED v2: hard but beatable - expect 1-2 deaths)
# Phase 1: HP > 66%   Phase 2: 33-66%   Phase 3 (ENRAGED): < 33%
#
# FIGHT FLOW (shield.mode: HEAL_LOCK - default)
#  1. The dragon can ALWAYS be hit. While crystals live they HEAL it.
#  2. Every destroyed crystal gets its OWN respawn timer (hologram + filling ring): see shield.crystal-respawn-seconds.
#  3. Destroy the LAST crystal before the FIRST one respawns -> SHIELD BREAKS and the dragon can
#     no longer heal (no crystal healing, no lifesteal) for `broken-seconds`.
#  4. Otherwise crystals come back one by one. Shield reforms when the break ends, and every
#     crystal returns the FIRST time the dragon reaches phase 2, phase 3 and at the rebirth (never again
#     if it heals back up and re-enters a phase). Individual crystal respawn timers keep running as usual.
#  5. After `fight.time-limit-seconds` the dragon goes DOOM (berserk).
#  (shield.mode: IMMUNITY brings back the old "immune until the shield breaks" fight.)

dragon:
  max-health: 1400
  damage-taken-multiplier: 0.6 # only used when shield.enabled = false
  max-damage-per-hit: 40       # 0 = off
  damage-dealt-multiplier: 1.7 # damage dealt by the dragon and its attacks
  lifesteal: 0            # dragon heals this fraction of damage it deals
  crystal-heal-per-second: 1.0 # healing per living crystal per second
  enrage-cooldown-multiplier: 0.6 # phase 3: ability cooldowns multiplied by this
  flip-facing: false           # set true if tail/mouth effects show up on the wrong end
  boss-bar-title: "&5&lImpossible Ender Dragon"

fight:
  time-limit-seconds: 840      # 14 minutes, then DOOM (0 = no limit)
  doom-damage-multiplier: 1.7
  doom-cooldown-multiplier: 0.5

shield:
  enabled: true
  mode: HEAL_LOCK              # HEAL_LOCK = always hittable, shield only controls healing | IMMUNITY = old behaviour
  crystal-respawn-seconds: 120  # each crystal comes back this long after it was destroyed
  broken-seconds: 200         # HEAL_LOCK: how long the dragon cannot heal after the shield breaks (0 = until the next phase)
  up-damage-multiplier: 1.0    # HEAL_LOCK: damage the dragon takes while the shield is up
  broken-damage-multiplier: 1.0
  phase-gate-floor: false      # HEAL_LOCK: true = one burst can't skip a phase (old behaviour)
  lock-land-on-break: true    # HEAL_LOCK: dragon lands on the portal when the shield breaks
  race-bar: true               # action bar: crystals left + time until the FIRST one comes back
  show-timers: true            # floating "Crystal returns in Ns" text (turns yellow/red + ticks near the end)
  # --- IMMUNITY mode only ---
  damage-multiplier: 0.0       # damage while shielded (0 = immune)
  heal-on-reform: 0.05         # if you were too slow the dragon regains this fraction of max HP
  land-on-break: true          # dragon lands on the portal while vulnerable

rebirth:                       # the dragon "dies" ONCE, then rises again in a FINAL FORM (phase 4)
  enabled: true
  duration-seconds: 6          # invulnerable rebirth animation
  health-fraction: 0.45        # health refilled to this fraction of max
  damage-multiplier: 1.2       # extra damage dealt in final form
  cooldown-multiplier: 0.8     # ability cooldowns in final form

abilities:
  fireball:                    # exploding dragon fireballs
    enabled: true
    min-phase: 1
    cooldown-seconds: 8
    count: 3                   # +1 per phase above 1, +1 per 2 players
    explosion-power: 2.5       # 0 = vanilla

  wither-skulls:
    enabled: true
    min-phase: 2
    cooldown-seconds: 11
    count: 3
    break-blocks: false

  lightning:                   # marked with sparks, strikes ~1s later
    enabled: true
    min-phase: 2
    cooldown-seconds: 10
    bolts: 3                   # +1 in phase 3, one per player in DOOM

  tail:                        # telegraphed tail sweep
    enabled: true
    min-phase: 1
    cooldown-seconds: 7
    range: 28
    damage: 9
    knockback: 1.5

  lightning-breath:            # charge at the mouth, beam hits where you WERE standing
    enabled: true
    min-phase: 2
    cooldown-seconds: 13
    windup-ticks: 24
    damage: 11                 # base damage, goes through dragon.damage-dealt-multiplier like everything else
    max-health-fraction: 0.4   # ONE breath hit can never take more than this share of a player's max HP (0 = no cap)
    edge-damage-factor: 0.6    # the rim of the beam only does this much of the damage (core = full)
    fire-ticks: 40             # burning time after a hit
    length: 70

  meteors:                     # marked circles, then fireballs fall from the sky
    enabled: true
    min-phase: 2
    cooldown-seconds: 17
    count: 5                   # +3 in phase 3
    explosion-power: 2.5
    break-blocks: false

  void-orbs:                   # homing shulker bullets (levitation)
    enabled: true
    min-phase: 2
    cooldown-seconds: 15
    count: 3

  gravity-well:                # drags everyone towards the dragon
    enabled: true
    min-phase: 3
    cooldown-seconds: 32
    radius: 40
    strength: 0.18
    duration-ticks: 45

  minions:
    enabled: true
    min-phase: 1
    cooldown-seconds: 25
    per-wave: 3
    max-alive: 12
    lifetime-seconds: 45
    types: [ENDERMITE]
    health: 35                 # ENDERMITE minions are buffed so they are real minions (0 = vanilla)
    damage: 5

  roar:                        # darkness + nausea + slowness
    enabled: true
    min-phase: 2
    cooldown-seconds: 30
    radius: 45

  levitation:                  # lifts you up, then you fall
    enabled: true
    min-phase: 3
    cooldown-seconds: 26
    duration-ticks: 35

perch:                         # dragon periodically flies down and perches on the portal (vanilla landing), also in phase 1
  enabled: true
  min-phase: 1                 # 1 = perches in every phase
  interval-seconds: 60         # time between perches (only while it is flying normally, never while the shield is broken)

effects:
  crystal-bubble:
    enabled: true              # violet sphere + lightning + rune circle around each crystal (needs ThreeHeadsDragon-ResourcePack.zip)
    scale: 1.0
  warning-text: bedrock        # action-bar warnings for attacks: bedrock | everyone | off
  crystal-circles:
    enabled: true              # animated purple circles, spinning shields, timer rings

rewards:
  bonus-xp: 
  items:                
messages:
  phase-2: "&d&lThe Impossible Dragon grows stronger..."
  phase-3: "&4&lTHE DRAGON IS ENRAGED!"
  roar: "&5The dragon roars!"
  lift: "&bThe void lifts you..."
  death: "&a&lThe Impossible Dragon has been slain!"
  doom: "&4&lTIME'S UP - THE DRAGON GOES BERSERK!"
  shield-broken: "&a&lSHIELD BROKEN!"
  shield-broken-sub: "&7Hit it! Vulnerable for {seconds}s"
  shield-broken-sub-lock: "&7The dragon can no longer heal for {seconds}s!"
  shield-broken-sub-lock-phase: "&7The dragon can no longer heal until its next phase!"
  shield-restored: "&5&lSHIELD RESTORED"
  shield-restored-sub: "&7Destroy every crystal again!"
  shield-restored-sub-lock: "&7Crystals are back - the dragon can heal again!"
  shield-race: "&5&lSHIELD RACE &8| &d{left} &7crystal(s) left &8| &7first returns in {time}"
  crystal-down: "&dCrystal destroyed &7(&f{down}&7/&f{total}&7) &8- &fback in {seconds}s"
  warn-tail: "&c&l! TAIL STRIKE - get away from the dragon !"
  warn-breath: "&e&l! LIGHTNING BREATH locked on you - MOVE !"
  warn-lightning: "&e&l! Lightning incoming - MOVE !"
  warn-meteors: "&6&l! METEORS - watch the ground circles !"
  warn-orbs: "&5&l! VOID ORBS are homing on you !"
  warn-pull: "&3&l! GRAVITY WELL - fight the pull !"
  rebirth: "&4&lTHE DRAGON REFUSES TO DIE!"
  rebirth-sub: "&7It rises again..."
  phase-4: "&4&lFINAL FORM - THE DRAGON IS REBORN!"
  phase-4-sub: "&7Faster. Stronger. No more second chances."
